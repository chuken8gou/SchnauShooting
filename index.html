<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SchnauShooting</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas {
  display: block;
  margin: 0 auto;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

// ============================================================
// Configuration
// ============================================================
const GAME_W = 240;
const GAME_H = 400;
const BG_COLOR = '#000';
const FG_COLOR = '#fff';
const ACCENT_COLOR = '#4fc3f7';
const DANGER_COLOR = '#ff5252';
const WARNING_COLOR = '#ffab40';
const SUCCESS_COLOR = '#69f0ae';

// Player hitbox radius (small, like a real bullet hell)
const PLAYER_HIT_R = 3;
const PLAYER_GRAZE_R = 10;

// ============================================================
// Canvas setup
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const windowW = window.innerWidth;
  const windowH = window.innerHeight;
  const scale = Math.min(windowW / GAME_W, windowH / GAME_H);
  canvas.width = GAME_W;
  canvas.height = GAME_H;
  canvas.style.width = Math.floor(GAME_W * scale) + 'px';
  canvas.style.height = Math.floor(GAME_H * scale) + 'px';
  canvas.style.marginTop = Math.floor((windowH - GAME_H * scale) / 2) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// Sound (Web Audio API — 8-bit style)
// ============================================================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playTone(freq, duration, type, volume) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = volume || 0.08;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sfxHit() { playTone(150, 0.3, 'square', 0.1); playTone(80, 0.4, 'sawtooth', 0.06); }
function sfxGraze() { playTone(1200, 0.05, 'sine', 0.03); }
function sfxClear() {
  [523, 659, 784, 1047].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.3, 'square', 0.08), i * 120);
  });
}
function sfxGameOver() {
  [400, 350, 300, 200].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.4, 'sawtooth', 0.08), i * 150);
  });
}
function sfxStart() { playTone(440, 0.1, 'square', 0.08); playTone(880, 0.15, 'square', 0.06); }

// ============================================================
// Pixel art helper
// ============================================================
function drawSprite(ctx, x, y, spriteData, palette, pixelSize) {
  const ps = pixelSize || 2;
  for (let row = 0; row < spriteData.length; row++) {
    const line = spriteData[row];
    for (let col = 0; col < line.length; col++) {
      const ch = line[col];
      if (ch === '.' || ch === ' ') continue;
      ctx.fillStyle = palette[ch] || FG_COLOR;
      ctx.fillRect(Math.floor(x + col * ps), Math.floor(y + row * ps), ps, ps);
    }
  }
}

// ============================================================
// Schnauzer sprite
// ============================================================
const schnauzerBody = [
  '....wwwwww....',
  '...wwwwwwww...',
  '..wwwwwwwwww..',
  '..wwewwwweww..',
  '..wwwwwwwwww..',
  '.gwwwwwwwwwwg.',
  '.gwwwwnnwwwwg.',
  '.ggwwwwwwwwgg.',
  '.gggwwwwwwggg.',
  '..gggggggggg..',
  '....wwwwww....',
  '...wwwwwwww...',
  '..wwwwwwwwww..',
  '..wwwwwwwwww..',
  '..wwwwwwwwww..',
  '...ww....ww...',
  '...ww....ww...',
  '..www....www..',
];
const schnauzerPalette = { 'w': '#ffffff', 'g': '#bbbbbb', 'e': '#000000', 'n': '#333333' };

// Taketompter frames
const copterFrames = [
  ['BBBBB..ccc..BBBBB', '......ccc........', '.......c.........'],
  ['........c........', '......ccc........', 'BBBBB..ccc..BBBBB'],
  ['.......c.........', '......ccc........', '.BBBB..ccc..BBBB.'],
  ['.......c.........', '......ccc........', '..BBB..ccc..BBB..'],
];
const copterPalette = { 'B': ACCENT_COLOR, 'c': '#8d6e63' };

// ============================================================
// Game state
// ============================================================
const STATE = { TITLE: 0, PLAYING: 1, CLEAR: 2, GAMEOVER: 3 };
let gameState = STATE.TITLE;
let frameCount = 0;
let stageTimer = 0;       // frames remaining
let stageTimerMax = 0;
let lives = 3;
let invincible = 0;       // invincibility frames remaining
let grazeCount = 0;
let shakeTimer = 0;

// Current stage definition
let currentStage = 0;

const STAGES = [
  { name: 'STAGE 1', time: 30, patterns: ['rain'] },
  { name: 'STAGE 2', time: 35, patterns: ['rain', 'aimed'] },
  { name: 'STAGE 3', time: 40, patterns: ['rain', 'aimed', 'spiral'] },
  { name: 'STAGE 4', time: 40, patterns: ['aimed', 'spiral', 'circle'] },
  { name: 'STAGE 5', time: 45, patterns: ['rain', 'aimed', 'spiral', 'circle'] },
];

// ============================================================
// Player
// ============================================================
const player = {
  x: GAME_W / 2,
  y: GAME_H * 0.75,
  spriteW: 14 * 2,
  spriteH: 18 * 2,
};

function resetPlayer() {
  player.x = GAME_W / 2;
  player.y = GAME_H * 0.75;
}

// ============================================================
// Bullets (object pool)
// ============================================================
const MAX_BULLETS = 500;
const bullets = [];

function spawnBullet(x, y, vx, vy, r, color) {
  for (let i = 0; i < bullets.length; i++) {
    if (!bullets[i].alive) {
      bullets[i].x = x; bullets[i].y = y;
      bullets[i].vx = vx; bullets[i].vy = vy;
      bullets[i].r = r || 2;
      bullets[i].color = color || FG_COLOR;
      bullets[i].alive = true;
      return;
    }
  }
  if (bullets.length < MAX_BULLETS) {
    bullets.push({ x, y, vx, vy, r: r || 2, color: color || FG_COLOR, alive: true });
  }
}

function clearBullets() {
  for (let i = 0; i < bullets.length; i++) bullets[i].alive = false;
}

function updateBullets() {
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (!b.alive) continue;
    b.x += b.vx;
    b.y += b.vy;
    // Off screen
    if (b.x < -20 || b.x > GAME_W + 20 || b.y < -20 || b.y > GAME_H + 20) {
      b.alive = false;
    }
  }
}

function drawBullets() {
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (!b.alive) continue;
    // Outer glow
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(Math.floor(b.x), Math.floor(b.y), b.r + 1, 0, Math.PI * 2);
    ctx.fill();
    // Core
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(Math.floor(b.x), Math.floor(b.y), b.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ============================================================
// Bullet patterns
// ============================================================
let patternTimers = {};

function resetPatterns() {
  patternTimers = { rain: 0, aimed: 0, spiral: 0, spiralAngle: 0, circle: 0 };
}

function updatePatterns() {
  const stage = STAGES[currentStage];
  const difficulty = currentStage + 1;

  for (const pat of stage.patterns) {
    switch (pat) {
      case 'rain':
        patternTimers.rain++;
        // Random bullets falling from top
        if (patternTimers.rain % Math.max(8, 20 - difficulty * 3) === 0) {
          const x = 10 + Math.random() * (GAME_W - 20);
          const speed = 1.2 + Math.random() * 0.8 + difficulty * 0.15;
          spawnBullet(x, -5, (Math.random() - 0.5) * 0.3, speed, 2, FG_COLOR);
        }
        break;

      case 'aimed':
        patternTimers.aimed++;
        // Bullets aimed at player from random edge positions
        if (patternTimers.aimed % Math.max(20, 50 - difficulty * 6) === 0) {
          const side = Math.random();
          let sx, sy;
          if (side < 0.6) {
            sx = Math.random() * GAME_W; sy = -5;
          } else if (side < 0.8) {
            sx = -5; sy = Math.random() * GAME_H * 0.4;
          } else {
            sx = GAME_W + 5; sy = Math.random() * GAME_H * 0.4;
          }
          const dx = player.x - sx;
          const dy = player.y - sy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const speed = 1.5 + difficulty * 0.2;
          spawnBullet(sx, sy, dx / dist * speed, dy / dist * speed, 3, DANGER_COLOR);
        }
        break;

      case 'spiral':
        patternTimers.spiral++;
        if (patternTimers.spiral % Math.max(4, 10 - difficulty) === 0) {
          patternTimers.spiralAngle += 0.5 + difficulty * 0.05;
          const a = patternTimers.spiralAngle;
          const speed = 1.3 + difficulty * 0.1;
          spawnBullet(
            GAME_W / 2, 30,
            Math.cos(a) * speed,
            Math.sin(a) * speed + 0.5,
            2, WARNING_COLOR
          );
        }
        break;

      case 'circle':
        patternTimers.circle++;
        // Periodic circular burst
        if (patternTimers.circle % Math.max(60, 120 - difficulty * 15) === 0) {
          const cx = 30 + Math.random() * (GAME_W - 60);
          const cy = 20 + Math.random() * 60;
          const count = 10 + difficulty * 2;
          const speed = 1.0 + difficulty * 0.15;
          for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 / count) * i;
            spawnBullet(cx, cy, Math.cos(a) * speed, Math.sin(a) * speed, 2, ACCENT_COLOR);
          }
        }
        break;
    }
  }
}

// ============================================================
// Collision detection
// ============================================================
function checkCollisions() {
  if (invincible > 0) return;

  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (!b.alive) continue;
    const dx = b.x - player.x;
    const dy = b.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Graze (near miss)
    if (dist < PLAYER_GRAZE_R + b.r && dist >= PLAYER_HIT_R + b.r) {
      if (!b.grazed) {
        b.grazed = true;
        grazeCount++;
        sfxGraze();
      }
    }

    // Hit
    if (dist < PLAYER_HIT_R + b.r) {
      onPlayerHit();
      return;
    }
  }
}

// ============================================================
// Particles
// ============================================================
const particles = [];

function spawnParticles(x, y, count, color, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.5 + Math.random() * 1.5) * (speed || 1);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 20 + Math.random() * 20,
      maxLife: 40,
      color: color || FG_COLOR,
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x) - 1, Math.floor(p.y) - 1, 2, 2);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// Stars background
// ============================================================
const stars = [];
for (let i = 0; i < 40; i++) {
  stars.push({
    x: Math.random() * GAME_W,
    y: Math.random() * GAME_H,
    speed: 0.3 + Math.random() * 0.7,
    brightness: Math.floor(80 + Math.random() * 100),
  });
}

function updateStars() {
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > GAME_H) { s.y = 0; s.x = Math.random() * GAME_W; }
  }
}

function drawStars() {
  for (const s of stars) {
    const v = s.brightness.toString(16).padStart(2, '0');
    ctx.fillStyle = '#' + v + v + v;
    ctx.fillRect(Math.floor(s.x), Math.floor(s.y), 1, 1);
  }
}

// ============================================================
// Player hit / game events
// ============================================================
function onPlayerHit() {
  lives--;
  invincible = 90; // 1.5 sec at 60fps
  shakeTimer = 15;
  sfxHit();
  spawnParticles(player.x, player.y, 20, DANGER_COLOR, 2);
  clearBullets();

  if (lives <= 0) {
    gameState = STATE.GAMEOVER;
    sfxGameOver();
  }
}

function startStage(idx) {
  currentStage = idx;
  const stage = STAGES[idx];
  stageTimerMax = stage.time * 60; // seconds to frames
  stageTimer = stageTimerMax;
  lives = 3;
  invincible = 60;
  grazeCount = 0;
  clearBullets();
  particles.length = 0;
  resetPatterns();
  resetPlayer();
  gameState = STATE.PLAYING;
  sfxStart();
}

// ============================================================
// Touch input (Android Chrome optimized)
// ============================================================
let touchActive = false;
let touchStartX = 0, touchStartY = 0;   // canvas coords at touch start
let rawStartX = 0, rawStartY = 0;       // screen px at touch start (for tap detection)
let playerStartX = 0, playerStartY = 0;
const TAP_THRESHOLD = 15; // px on screen — movement within this counts as a tap

function getCanvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / rect.width * GAME_W,
    y: (clientY - rect.top) / rect.height * GAME_H,
  };
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  const t = e.touches[0];
  const pos = getCanvasPos(t.clientX, t.clientY);
  touchActive = true;
  touchStartX = pos.x;
  touchStartY = pos.y;
  rawStartX = t.clientX;
  rawStartY = t.clientY;
  playerStartX = player.x;
  playerStartY = player.y;
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!touchActive) return;
  const t = e.touches[0];
  const pos = getCanvasPos(t.clientX, t.clientY);
  if (gameState === STATE.PLAYING) {
    player.x = playerStartX + (pos.x - touchStartX);
    player.y = playerStartY + (pos.y - touchStartY);
    clampPlayer();
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (!touchActive) return;
  touchActive = false;
  // Tap detection: check how far finger moved from start in screen pixels
  const ct = e.changedTouches[0];
  const dx = ct.clientX - rawStartX;
  const dy = ct.clientY - rawStartY;
  if (dx * dx + dy * dy < TAP_THRESHOLD * TAP_THRESHOLD) {
    handleTap();
  }
}, { passive: false });

function handleTap() {
  if (gameState === STATE.TITLE) {
    startStage(currentStage);
  } else if (gameState === STATE.CLEAR) {
    if (currentStage < STAGES.length - 1) {
      currentStage++;
    }
    gameState = STATE.TITLE;
  } else if (gameState === STATE.GAMEOVER) {
    gameState = STATE.TITLE;
  }
}

function clampPlayer() {
  const hw = player.spriteW / 2;
  const hh = player.spriteH / 2;
  player.x = Math.max(hw, Math.min(GAME_W - hw, player.x));
  player.y = Math.max(hh, Math.min(GAME_H - hh, player.y));
}

// ============================================================
// Drawing helpers
// ============================================================
function drawPlayer() {
  // Invincibility blink
  if (invincible > 0 && Math.floor(invincible / 4) % 2 === 0) return;

  const px = player.x - player.spriteW / 2;
  const py = player.y - player.spriteH / 2;

  // Taketompter
  const copterIdx = Math.floor(frameCount / 4) % copterFrames.length;
  const copterW = 18 * 2;
  drawSprite(ctx, player.x - copterW / 2, py - 12, copterFrames[copterIdx], copterPalette, 2);

  // Schnauzer
  drawSprite(ctx, px, py, schnauzerBody, schnauzerPalette, 2);

  // Hitbox indicator (small dot at center)
  ctx.fillStyle = ACCENT_COLOR;
  ctx.globalAlpha = 0.6 + Math.sin(frameCount * 0.15) * 0.4;
  ctx.beginPath();
  ctx.arc(Math.floor(player.x), Math.floor(player.y), PLAYER_HIT_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawTimerBar() {
  const ratio = stageTimer / stageTimerMax;
  const barW = GAME_W - 16;
  const barH = 4;
  const bx = 8;
  const by = 18;

  // Background
  ctx.fillStyle = '#333';
  ctx.fillRect(bx, by, barW, barH);

  // Fill
  let barColor = SUCCESS_COLOR;
  if (ratio < 0.3) barColor = DANGER_COLOR;
  else if (ratio < 0.6) barColor = WARNING_COLOR;
  ctx.fillStyle = barColor;
  ctx.fillRect(bx, by, Math.floor(barW * ratio), barH);

  // Time text
  const secs = Math.ceil(stageTimer / 60);
  ctx.fillStyle = FG_COLOR;
  ctx.font = '8px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(secs + 's', GAME_W - 8, 14);
}

function drawLives() {
  ctx.fillStyle = FG_COLOR;
  ctx.font = '8px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('LIFE', 8, 14);

  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = i < lives ? DANGER_COLOR : '#333';
    ctx.fillRect(32 + i * 10, 9, 7, 7);
  }
}

function drawGraze() {
  ctx.fillStyle = '#888';
  ctx.font = '8px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('GRAZE ' + grazeCount, 8, GAME_H - 8);
}

function drawBulletCount() {
  let count = 0;
  for (let i = 0; i < bullets.length; i++) if (bullets[i].alive) count++;
  ctx.fillStyle = '#555';
  ctx.font = '8px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(count + ' BULLETS', GAME_W - 8, GAME_H - 8);
}

// ============================================================
// Screen draws
// ============================================================
function drawTitleScreen() {
  ctx.fillStyle = FG_COLOR;
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SCHNAU SHOOTING', GAME_W / 2, 80);

  // Draw a big schnauzer in the center
  const bigScale = 3;
  const sw = 14 * bigScale;
  const sh = 18 * bigScale;
  const copterIdx = Math.floor(frameCount / 4) % copterFrames.length;
  drawSprite(ctx, GAME_W / 2 - 18 * bigScale / 2, 120 - 18, copterFrames[copterIdx], copterPalette, bigScale);
  drawSprite(ctx, GAME_W / 2 - sw / 2, 120, schnauzerBody, schnauzerPalette, bigScale);

  // Stage info
  const stage = STAGES[currentStage];
  ctx.fillStyle = ACCENT_COLOR;
  ctx.font = '8px monospace';
  ctx.fillText(stage.name, GAME_W / 2, 200);
  ctx.fillStyle = '#888';
  ctx.fillText('TIME: ' + stage.time + 's', GAME_W / 2, 215);
  ctx.fillText('PATTERNS: ' + stage.patterns.join(', ').toUpperCase(), GAME_W / 2, 228);

  // Stage select arrows
  if (currentStage > 0) {
    ctx.fillStyle = FG_COLOR;
    ctx.fillText('<', GAME_W / 2 - 60, 200);
  }
  if (currentStage < STAGES.length - 1) {
    ctx.fillStyle = FG_COLOR;
    ctx.fillText('>', GAME_W / 2 + 60, 200);
  }

  // Start prompt
  const blink = Math.floor(frameCount / 30) % 2 === 0;
  if (blink) {
    ctx.fillStyle = FG_COLOR;
    ctx.font = '8px monospace';
    ctx.fillText('TAP TO START', GAME_W / 2, 310);
  }

  // Instructions
  ctx.fillStyle = '#666';
  ctx.fillText('SURVIVE THE BULLETS!', GAME_W / 2, 350);
  ctx.fillText('DRAG TO MOVE', GAME_W / 2, 365);
}

function drawClearScreen() {
  ctx.fillStyle = SUCCESS_COLOR;
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('STAGE CLEAR!', GAME_W / 2, 120);

  ctx.fillStyle = FG_COLOR;
  ctx.font = '8px monospace';
  ctx.fillText(STAGES[currentStage].name + ' COMPLETED', GAME_W / 2, 150);
  ctx.fillText('GRAZE: ' + grazeCount, GAME_W / 2, 175);

  // Rating
  let rating = 'C';
  if (lives === 3 && grazeCount >= 50) rating = 'S';
  else if (lives === 3) rating = 'A';
  else if (lives >= 2) rating = 'B';
  ctx.fillStyle = rating === 'S' ? WARNING_COLOR : FG_COLOR;
  ctx.font = '10px monospace';
  ctx.fillText('RANK: ' + rating, GAME_W / 2, 200);

  const blink = Math.floor(frameCount / 30) % 2 === 0;
  if (blink) {
    ctx.fillStyle = FG_COLOR;
    ctx.font = '8px monospace';
    if (currentStage < STAGES.length - 1) {
      ctx.fillText('TAP FOR NEXT STAGE', GAME_W / 2, 280);
    } else {
      ctx.fillText('ALL STAGES CLEAR!', GAME_W / 2, 260);
      ctx.fillText('TAP TO RETURN', GAME_W / 2, 280);
    }
  }
}

function drawGameOverScreen() {
  ctx.fillStyle = DANGER_COLOR;
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', GAME_W / 2, 150);

  const secs = Math.ceil(stageTimer / 60);
  const total = STAGES[currentStage].time;
  ctx.fillStyle = FG_COLOR;
  ctx.font = '8px monospace';
  ctx.fillText('SURVIVED: ' + (total - secs) + '/' + total + 's', GAME_W / 2, 180);
  ctx.fillText('GRAZE: ' + grazeCount, GAME_W / 2, 200);

  const blink = Math.floor(frameCount / 30) % 2 === 0;
  if (blink) {
    ctx.fillStyle = FG_COLOR;
    ctx.font = '8px monospace';
    ctx.fillText('TAP TO RETRY', GAME_W / 2, 280);
  }
}

// ============================================================
// Main loop
// ============================================================
function update() {
  frameCount++;
  updateStars();
  updateParticles();

  if (gameState === STATE.PLAYING) {
    if (invincible > 0) invincible--;
    if (shakeTimer > 0) shakeTimer--;

    // Timer countdown
    stageTimer--;
    if (stageTimer <= 0) {
      gameState = STATE.CLEAR;
      clearBullets();
      sfxClear();
      spawnParticles(player.x, player.y, 40, SUCCESS_COLOR, 3);
      return;
    }

    updatePatterns();
    updateBullets();
    checkCollisions();
  }
}

function draw() {
  // Screen shake offset
  let sx = 0, sy = 0;
  if (shakeTimer > 0) {
    sx = (Math.random() - 0.5) * shakeTimer * 0.5;
    sy = (Math.random() - 0.5) * shakeTimer * 0.5;
  }

  ctx.save();
  ctx.translate(Math.floor(sx), Math.floor(sy));

  // Clear
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(-10, -10, GAME_W + 20, GAME_H + 20);
  drawStars();

  switch (gameState) {
    case STATE.TITLE:
      drawTitleScreen();
      break;

    case STATE.PLAYING:
      drawBullets();
      drawPlayer();
      drawParticles();
      drawLives();
      drawTimerBar();
      drawGraze();
      drawBulletCount();
      break;

    case STATE.CLEAR:
      drawPlayer();
      drawParticles();
      drawClearScreen();
      break;

    case STATE.GAMEOVER:
      drawParticles();
      drawGameOverScreen();
      break;
  }

  ctx.restore();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
